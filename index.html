<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <title>ProTray 外贸知识库</title>

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <!-- =====================================================
         Docsify Vue 主题
         ===================================================== -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/docsify/themes/vue.css"
    >


    <!-- =====================================================
         ProTray 自定义样式
         ===================================================== -->

    <style>

        /* =====================================================
           左侧栏分类折叠
           ===================================================== */

        /*
         * 所有有子菜单的分类默认隐藏子菜单
         */
        .sidebar-nav li.protray-collapse-group > ul,
        .sidebar-nav li.protray-sub-collapse-group > ul {

            display: none;

        }


        /*
         * 展开状态
         */
        .sidebar-nav li.protray-collapse-group.protray-expanded > ul,
        .sidebar-nav li.protray-sub-collapse-group.protray-expanded > ul {

            display: block;

        }


        /* =====================================================
           分类标题
           ===================================================== */

        .sidebar-nav
        li.protray-collapse-group
        > .protray-folder-title,

        .sidebar-nav
        li.protray-sub-collapse-group
        > .protray-folder-title {

            cursor: pointer;

            user-select: none;

            position: relative;

        }


        /* =====================================================
           一级分类箭头
           ===================================================== */

        .sidebar-nav
        li.protray-collapse-group
        > .protray-folder-title::before {

            content: '▶';

            display: inline-block;

            width: 18px;

            margin-right: 2px;

            font-size: 10px;

            transition: transform 0.2s ease;

        }


        /*
         * 一级分类展开
         */
        .sidebar-nav
        li.protray-collapse-group.protray-expanded
        > .protray-folder-title::before {

            transform: rotate(90deg);

        }


        /* =====================================================
           二级分类箭头
           ===================================================== */

        .sidebar-nav
        li.protray-sub-collapse-group
        > .protray-folder-title::before {

            content: '▶';

            display: inline-block;

            width: 16px;

            margin-right: 2px;

            font-size: 9px;

            transition: transform 0.2s ease;

        }


        /*
         * 二级分类展开
         */
        .sidebar-nav
        li.protray-sub-collapse-group.protray-expanded
        > .protray-folder-title::before {

            transform: rotate(90deg);

        }


        /* =====================================================
           鼠标悬停
           ===================================================== */

        .sidebar-nav
        li.protray-collapse-group
        > .protray-folder-title:hover,

        .sidebar-nav
        li.protray-sub-collapse-group
        > .protray-folder-title:hover {

            color: #42b983;

        }


        /*
         * 普通链接保持 Docsify 原来的行为
         */
        .sidebar-nav a {

            cursor: pointer;

        }

    </style>

</head>


<body>

<div id="app"></div>


<script>

    /* =========================================================
       Docsify 配置
       ========================================================= */

    window.$docsify = {

        /*
         * 网站名称
         */
        name: 'ProTray 外贸知识库',


        /*
         * GitHub 仓库
         */
        repo:
            'https://github.com/mcqwy/ProTray-Knowledge-Base',


        /*
         * 使用根目录 Sidebar
         */
        loadSidebar: '_sidebar.md',


        /*
         * =====================================================
         * 关键：
         *
         * 无论当前页面在哪个子目录，
         * 永远使用根目录的 _sidebar.md
         *
         * 防止：
         *
         * /1_市场调研/_sidebar.md
         *
         * 404
         * =====================================================
         */

        alias: {

            '/.*/_sidebar.md':
                '/_sidebar.md'

        },


        /*
         * Sidebar 只显示一级目录结构
         *
         * 这里不依赖 Docsify 自动展开目录。
         * 我们自己控制折叠。
         */
        subMaxLevel: 1,


        /*
         * 页面切换自动回顶部
         */
        auto2top: true,


        /*
         * 不使用 hashbang
         */
        hashbang: false,


        /*
         * =====================================================
         * 搜索
         * =====================================================
         */

        search: {

            placeholder:
                '🔍 搜索文档...',

            noData:
                '😅 没有找到相关内容',

            depth: 6,

            hideOtherSidebarContent: false

        },


        /*
         * =====================================================
         * 顶部导航
         * =====================================================
         */

        navbar: [

            {
                title: '🏠 首页',

                path: '/'
            },

            {
                title: '📖 获客指南',

                path:
                    '/外贸获客全景指南'
            },

            {
                title: '📊 成交指南',

                path:
                    '/外贸报价与成交指南'
            },

            {
                title: '🤖 AI 工具',

                path:
                    '/7_ai工具相关/AI赋能外贸实战指南'
            }

        ],


        /*
         * =====================================================
         * ★★★ 修复数字开头标题的锚点问题 ★★★
         *
         * 原来：
         *
         * # 6. 售后与复购篇
         *
         * 可能生成：
         *
         * id="6-售后与复购篇"
         *
         * 然后：
         *
         * querySelector('#6-售后与复购篇')
         *
         * 会报错。
         *
         * 现在：
         *
         * 6. 售后与复购篇
         *
         * 变成：
         *
         * h-6-售后与复购篇
         *
         * 以字母开头，因此是合法 CSS selector。
         * =====================================================
         */

        slugify: function (text) {

            /*
             * 去除前后空格
             */
            var slug =
                String(text || '')
                    .trim()
                    .toLowerCase();


            /*
             * 空格转换为 -
             */
            slug =
                slug.replace(
                    /\s+/g,
                    '-'
                );


            /*
             * Docsify 常见标点处理
             *
             * 保留：
             *
             * 中文
             * 英文
             * 数字
             * -
             */
            slug =
                slug.replace(
                    /[^\w\u4e00-\u9fff\-]/g,
                    ''
                );


            /*
             * 连续 - 合并
             */
            slug =
                slug.replace(
                    /-+/g,
                    '-'
                );


            /*
             * 去掉开头和结尾 -
             */
            slug =
                slug.replace(
                    /^-+|-+$/g,
                    ''
                );


            /*
             * =================================================
             * ★ 核心修复
             *
             * 如果 ID 是数字开头，
             * 前面加 h-
             * =================================================
             */

            if (
                /^[0-9]/.test(slug)
            ) {

                slug =
                    'h-' + slug;

            }


            return slug;

        }

    };



    /* =========================================================
       ProTray Sidebar 折叠系统
       ========================================================= */

    (function () {

        'use strict';


        /* =====================================================
           localStorage Key
           ===================================================== */

        var STORAGE_KEY =
            'protray-sidebar-collapse-state-v2';



        /* =====================================================
           读取保存状态
           ===================================================== */

        function loadState() {

            try {

                var saved =
                    localStorage.getItem(
                        STORAGE_KEY
                    );


                if (!saved) {

                    return {};

                }


                var state =
                    JSON.parse(saved);


                if (
                    !state
                    ||
                    typeof state !== 'object'
                ) {

                    return {};

                }


                return state;

            }
            catch (error) {

                console.warn(
                    'ProTray：读取 Sidebar 状态失败',
                    error
                );

                return {};

            }

        }



        /* =====================================================
           保存状态
           ===================================================== */

        function saveState() {

            try {

                var state = {};


                var groups =
                    document.querySelectorAll(
                        '.sidebar-nav ' +
                        '.protray-collapse-group, ' +
                        '.sidebar-nav ' +
                        '.protray-sub-collapse-group'
                    );


                for (
                    var i = 0;
                    i < groups.length;
                    i++
                ) {

                    var group =
                        groups[i];


                    var key =
                        group.getAttribute(
                            'data-protray-key'
                        );


                    if (!key) {

                        continue;

                    }


                    state[key] =
                        group.classList.contains(
                            'protray-expanded'
                        );

                }


                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(state)
                );

            }
            catch (error) {

                console.warn(
                    'ProTray：保存 Sidebar 状态失败',
                    error
                );

            }

        }



        /* =====================================================
           获取直属 UL
           ===================================================== */

        function getDirectSubmenu(li) {

            var children =
                li.children;


            for (
                var i = 0;
                i < children.length;
                i++
            ) {

                if (
                    children[i].tagName === 'UL'
                ) {

                    return children[i];

                }

            }


            return null;

        }



        /* =====================================================
           获取分类标题
           ===================================================== */

        function getFolderTitle(li) {

            var children =
                li.children;


            for (
                var i = 0;
                i < children.length;
                i++
            ) {

                var child =
                    children[i];


                /*
                 * UL 是子菜单
                 */
                if (
                    child.tagName === 'UL'
                ) {

                    continue;

                }


                /*
                 * 优先处理 P
                 */
                if (
                    child.tagName === 'P'
                ) {

                    return child;

                }


                /*
                 * STRONG
                 */
                if (
                    child.tagName === 'STRONG'
                ) {

                    return child;

                }


                /*
                 * DIV
                 */
                if (
                    child.tagName === 'DIV'
                ) {

                    return child;

                }


                /*
                 * A
                 */
                if (
                    child.tagName === 'A'
                ) {

                    return child;

                }

            }


            return null;

        }



        /* =====================================================
           获取标题文字
           ===================================================== */

        function getTitleText(title) {

            if (!title) {

                return '';

            }


            return (
                title.textContent || ''
            )
                .replace(
                    /\s+/g,
                    ' '
                )
                .trim();

        }



        /* =====================================================
           生成唯一 Key
           ===================================================== */

        function getGroupKey(
            li,
            isTopLevel
        ) {

            var title =
                getFolderTitle(li);


            var text =
                getTitleText(title);


            if (isTopLevel) {

                return (
                    'top:' +
                    text
                );

            }


            /*
             * 找父级 LI
             */
            var parentUl =
                li.parentElement;


            var parentLi =
                parentUl
                    ? parentUl.parentElement
                    : null;


            var parentTitle =
                parentLi
                    ? getFolderTitle(parentLi)
                    : null;


            var parentText =
                getTitleText(parentTitle);


            return (
                'sub:' +
                parentText +
                '/' +
                text
            );

        }



        /* =====================================================
           恢复状态
           ===================================================== */

        function restoreState(
            li,
            key,
            savedState
        ) {

            /*
             * 如果之前保存过
             */
            if (
                Object.prototype.hasOwnProperty.call(
                    savedState,
                    key
                )
            ) {

                if (
                    savedState[key] === true
                ) {

                    li.classList.add(
                        'protray-expanded'
                    );

                }
                else {

                    li.classList.remove(
                        'protray-expanded'
                    );

                }


                return;

            }


            /*
             * =================================================
             * ★ 第一次出现：
             *
             * 默认折叠
             * =================================================
             */

            li.classList.remove(
                'protray-expanded'
            );

        }



        /* =====================================================
           关闭同级其他分类
           ===================================================== */

        function closeSiblingGroups(
            currentLi
        ) {

            var parent =
                currentLi.parentElement;


            if (!parent) {

                return;

            }


            var siblings =
                parent.children;


            for (
                var i = 0;
                i < siblings.length;
                i++
            ) {

                var sibling =
                    siblings[i];


                if (
                    sibling === currentLi
                ) {

                    continue;

                }


                /*
                 * 只处理折叠分类
                 */
                if (
                    sibling.classList.contains(
                        'protray-collapse-group'
                    )
                    ||
                    sibling.classList.contains(
                        'protray-sub-collapse-group'
                    )
                ) {

                    sibling.classList.remove(
                        'protray-expanded'
                    );


                    /*
                     * 如果关闭的是一级分类，
                     * 同时关闭内部二级分类。
                     */
                    var innerGroups =
                        sibling.querySelectorAll(
                            '.protray-expanded'
                        );


                    for (
                        var j = 0;
                        j < innerGroups.length;
                        j++
                    ) {

                        innerGroups[j]
                            .classList
                            .remove(
                                'protray-expanded'
                            );

                    }

                }

            }

        }



        /* =====================================================
           绑定折叠分类
           ===================================================== */

        function bindCollapseGroup(
            li,
            isTopLevel,
            savedState
        ) {

            /*
             * 获取子菜单
             */
            var submenu =
                getDirectSubmenu(li);


            /*
             * 没有子菜单：
             *
             * 普通文档链接
             *
             * ★ 不处理
             */
            if (!submenu) {

                return;

            }


            /*
             * 获取标题
             */
            var title =
                getFolderTitle(li);


            if (!title) {

                return;

            }


            /*
             * 已经绑定过
             */
            if (
                li.getAttribute(
                    'data-protray-bound'
                ) === 'true'
            ) {

                return;

            }


            /*
             * 生成 Key
             */
            var key =
                getGroupKey(
                    li,
                    isTopLevel
                );


            li.setAttribute(
                'data-protray-key',
                key
            );


            li.setAttribute(
                'data-protray-bound',
                'true'
            );


            /*
             * 添加 CSS Class
             */
            if (isTopLevel) {

                li.classList.add(
                    'protray-collapse-group'
                );

            }
            else {

                li.classList.add(
                    'protray-sub-collapse-group'
                );

            }


            /*
             * 标题 Class
             */
            title.classList.add(
                'protray-folder-title'
            );


            /*
             * 恢复状态
             */
            restoreState(
                li,
                key,
                savedState
            );


            /* =================================================
               点击分类标题
               ================================================= */

            title.addEventListener(
                'click',
                function (event) {

                    /*
                     * =================================================
                     * 如果标题本身是真正的链接：
                     *
                     * 不拦截。
                     *
                     * 这样不会破坏 Docsify 正常导航。
                     * =================================================
                     */

                    if (
                        title.tagName === 'A'
                        &&
                        title.getAttribute('href')
                        &&
                        title.getAttribute('href') !== '#'
                    ) {

                        return;

                    }


                    /*
                     * 分类标题不是文档链接，
                     * 阻止默认行为。
                     */
                    event.preventDefault();

                    event.stopPropagation();


                    /*
                     * 当前状态
                     */
                    var isExpanded =
                        li.classList.contains(
                            'protray-expanded'
                        );


                    /*
                     * 关闭同级其他分类
                     */
                    closeSiblingGroups(
                        li
                    );


                    /*
                     * 切换当前分类
                     */
                    if (isExpanded) {

                        li.classList.remove(
                            'protray-expanded'
                        );

                    }
                    else {

                        li.classList.add(
                            'protray-expanded'
                        );

                    }


                    /*
                     * ★ 立即保存
                     */
                    saveState();

                }
            );

        }



        /* =====================================================
           初始化 Sidebar
           ===================================================== */

        function initSidebar() {

            var sidebar =
                document.querySelector(
                    '.sidebar-nav'
                );


            if (!sidebar) {

                return;

            }


            /*
             * 保存状态
             */
            var savedState =
                loadState();


            /*
             * 获取根 UL
             */
            var rootUl = null;


            for (
                var i = 0;
                i < sidebar.children.length;
                i++
            ) {

                if (
                    sidebar.children[i].tagName === 'UL'
                ) {

                    rootUl =
                        sidebar.children[i];

                    break;

                }

            }


            if (!rootUl) {

                return;

            }



            /* =================================================
               一级分类
               ================================================= */

            var topItems =
                rootUl.children;


            for (
                var i = 0;
                i < topItems.length;
                i++
            ) {

                var topItem =
                    topItems[i];


                if (
                    topItem.tagName !== 'LI'
                ) {

                    continue;

                }


                if (
                    getDirectSubmenu(topItem)
                ) {

                    bindCollapseGroup(
                        topItem,
                        true,
                        savedState
                    );

                }

            }



            /* =================================================
               二级 / 三级分类
               ================================================= */

            var allItems =
                sidebar.querySelectorAll(
                    'li'
                );


            for (
                var i = 0;
                i < allItems.length;
                i++
            ) {

                var item =
                    allItems[i];


                /*
                 * 一级已经处理
                 */
                if (
                    item.parentElement === rootUl
                ) {

                    continue;

                }


                /*
                 * 有子菜单才处理
                 */
                if (
                    getDirectSubmenu(item)
                ) {

                    bindCollapseGroup(
                        item,
                        false,
                        savedState
                    );

                }

            }

        }



        /* =====================================================
           Docsify 初始化之后执行
           ===================================================== */

        function start() {

            setTimeout(
                initSidebar,
                300
            );

        }



        /* =====================================================
           页面加载
           ===================================================== */

        if (
            document.readyState === 'loading'
        ) {

            document.addEventListener(
                'DOMContentLoaded',
                start
            );

        }
        else {

            start();

        }



        /* =====================================================
           监听 Docsify Sidebar 动态变化

           Docsify 是 SPA：

           点击文档
           ↓
           路由变化
           ↓
           Sidebar 可能重新生成

           所以需要重新绑定。
           ===================================================== */

        var checkTimer =
            setInterval(
                function () {

                    var sidebar =
                        document.querySelector(
                            '.sidebar-nav'
                        );


                    if (!sidebar) {

                        return;

                    }


                    clearInterval(
                        checkTimer
                    );


                    /*
                     * 第一次初始化
                     */
                    initSidebar();


                    /*
                     * MutationObserver
                     */
                    var observer =
                        new MutationObserver(
                            function () {

                                /*
                                 * Docsify 修改 DOM 后，
                                 * 等它完成再重新检查。
                                 */
                                setTimeout(
                                    initSidebar,
                                    100
                                );

                            }
                        );


                    observer.observe(
                        sidebar,
                        {

                            childList: true,

                            subtree: true

                        }
                    );

                },
                200
            );

    })();

</script>



<!-- =========================================================
     Docsify
     ========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js">
</script>

     Search
     ========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js">
</script>


</body>
