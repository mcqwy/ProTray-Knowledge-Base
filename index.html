<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <title>ProTray 外贸知识库</title>

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <!-- =====================================================
         Docsify Vue 主题
         ===================================================== -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/docsify/themes/vue.css"
    >


    <!-- =====================================================
         ProTray 左侧栏折叠样式
         ===================================================== -->
    <style>

        /* =====================================================
           一级分类
           ===================================================== */

        /*
         * 有子菜单的一级分类，默认隐藏子菜单
         */
        .sidebar-nav > ul > li.protray-collapse-group > ul {
            display: none;
        }


        /*
         * 一级分类展开
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group.protray-expanded
        > ul {
            display: block;
        }


        /*
         * 一级分类标题
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group
        > .protray-folder-title {

            cursor: pointer;

            user-select: none;

            font-weight: 600;

            position: relative;
        }


        /*
         * 一级分类箭头
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group
        > .protray-folder-title::before {

            content: '▶';

            display: inline-block;

            width: 18px;

            margin-right: 2px;

            font-size: 10px;

            transition:
                    transform 0.2s ease;
        }


        /*
         * 一级分类展开后的箭头
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group.protray-expanded
        > .protray-folder-title::before {

            transform: rotate(90deg);
        }


        /*
         * 鼠标悬停
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group
        > .protray-folder-title:hover {

            color: #42b983;
        }



        /* =====================================================
           二级分类

           例如：

           📁 业务资料库
               🏭 工厂档案
                   目录索引
                   资质证书清单

               📦 产品资料
                   产品目录
                   规格书模板
           ===================================================== */


        /*
         * 二级分类默认隐藏
         */
        .sidebar-nav
        li.protray-sub-collapse-group
        > ul {

            display: none;
        }


        /*
         * 二级分类展开
         */
        .sidebar-nav
        li.protray-sub-collapse-group.protray-expanded
        > ul {

            display: block;
        }


        /*
         * 二级分类标题
         */
        .sidebar-nav
        li.protray-sub-collapse-group
        > .protray-folder-title {

            cursor: pointer;

            user-select: none;

            position: relative;
        }


        /*
         * 二级分类箭头
         */
        .sidebar-nav
        li.protray-sub-collapse-group
        > .protray-folder-title::before {

            content: '▶';

            display: inline-block;

            width: 16px;

            margin-right: 2px;

            font-size: 9px;

            transition:
                    transform 0.2s ease;
        }


        /*
         * 二级分类展开后的箭头
         */
        .sidebar-nav
        li.protray-sub-collapse-group.protray-expanded
        > .protray-folder-title::before {

            transform: rotate(90deg);
        }


        /*
         * 鼠标悬停
         */
        .sidebar-nav
        li.protray-sub-collapse-group
        > .protray-folder-title:hover {

            color: #42b983;
        }



        /* =====================================================
           普通文档链接

           不修改它们的点击行为
           ===================================================== */

        .sidebar-nav a {

            cursor: pointer;
        }

    </style>

</head>


<body>

<div id="app"></div>


<script>

    /* =========================================================
       Docsify 配置
       ========================================================= */

    window.$docsify = {

        /*
         * 网站名称
         */
        name: 'ProTray 外贸知识库',


        /*
         * GitHub 仓库
         */
        repo:
            'https://github.com/mcqwy/ProTray-Knowledge-Base',


        /*
         * 使用根目录侧边栏
         */
        loadSidebar: '_sidebar.md',


        /*
         * =====================================================
         * ★ 解决子目录 _sidebar.md 404
         * =====================================================
         *
         * 例如进入：
         *
         * /1_市场调研/调研指南.md
         *
         * Docsify 原本可能尝试：
         *
         * /1_市场调研/_sidebar.md
         *
         * 现在强制全部指向：
         *
         * /_sidebar.md
         */

        alias: {

            '/.*/_sidebar.md':
                '/_sidebar.md'

        },


        /*
         * 侧边栏层级
         */
        subMaxLevel: 1,


        /*
         * 自动回到顶部
         */
        auto2top: true,


        /*
         * 不使用 #!
         */
        hashbang: false,


        /*
         * =====================================================
         * 搜索
         * =====================================================
         */

        search: {

            placeholder:
                '🔍 搜索文档...',

            noData:
                '😅 没有找到相关内容',

            depth: 6,

            hideOtherSidebarContent: false

        },


        /*
         * =====================================================
         * 顶部导航
         * =====================================================
         */

        navbar: [

            {
                title: '🏠 首页',

                path: '/'
            },

            {
                title: '📖 获客指南',

                path:
                    '/外贸获客全景指南'
            },

            {
                title: '📊 成交指南',

                path:
                    '/外贸报价与成交指南'
            },

            {
                title: '🤖 AI 工具',

                path:
                    '/7_ai工具相关/AI赋能外贸实战指南'
            }

        ]

    };



    /* =========================================================
       ProTray 左侧栏折叠系统
       ========================================================= */

    (function () {

        'use strict';



        /* =====================================================
           获取元素的直属 UL
           ===================================================== */

        function getDirectSubmenu(li) {

            var children = li.children;

            for (
                var i = 0;
                i < children.length;
                i++
            ) {

                if (
                    children[i].tagName === 'UL'
                ) {

                    return children[i];

                }

            }

            return null;
        }



        /* =====================================================
           获取分类标题元素

           你的 _sidebar.md 中分类标题通常类似：

           <li>
               <p>
                   <strong>📊 战略决策</strong>
               </p>

               <ul>
                   ...
               </ul>
           </li>

           所以这里不能假设标题一定是 <a>。
           ===================================================== */

        function getFolderTitle(li) {

            var children = li.children;

            for (
                var i = 0;
                i < children.length;
                i++
            ) {

                var child = children[i];


                /*
                 * UL 是菜单本身，不是标题
                 */
                if (
                    child.tagName === 'UL'
                ) {

                    continue;

                }


                /*
                 * 如果是 P
                 */
                if (
                    child.tagName === 'P'
                ) {

                    return child;

                }


                /*
                 * 如果是 DIV
                 */
                if (
                    child.tagName === 'DIV'
                ) {

                    return child;

                }


                /*
                 * 如果是 STRONG
                 */
                if (
                    child.tagName === 'STRONG'
                ) {

                    return child;

                }


                /*
                 * 如果是普通 A
                 *
                 * 这里只作为最后备用方案。
                 */
                if (
                    child.tagName === 'A'
                ) {

                    return child;

                }

            }

            return null;
        }



        /* =====================================================
           关闭同级分类
           ===================================================== */

        function closeSiblingGroups(
            currentLi
        ) {

            var parent =
                currentLi.parentElement;

            if (!parent) {

                return;

            }


            var siblings =
                parent.children;


            for (
                var i = 0;
                i < siblings.length;
                i++
            ) {

                var sibling =
                    siblings[i];


                if (
                    sibling === currentLi
                ) {

                    continue;

                }


                if (
                    sibling.classList.contains(
                        'protray-collapse-group'
                    )
                    ||
                    sibling.classList.contains(
                        'protray-sub-collapse-group'
                    )
                ) {

                    sibling.classList.remove(
                        'protray-expanded'
                    );


                    /*
                     * 同时关闭内部已经展开的子分类
                     */
                    var innerGroups =
                        sibling.querySelectorAll(
                            '.protray-expanded'
                        );


                    for (
                        var j = 0;
                        j < innerGroups.length;
                        j++
                    ) {

                        innerGroups[j]
                            .classList
                            .remove(
                                'protray-expanded'
                            );

                    }

                }

            }

        }



        /* =====================================================
           给一个分类绑定折叠功能
           ===================================================== */

        function bindCollapseGroup(
            li,
            isTopLevel
        ) {

            /*
             * 找直属子菜单
             */
            var submenu =
                getDirectSubmenu(li);


            /*
             * 没有子菜单
             *
             * 说明这是普通文档链接
             *
             * ★ 绝对不能处理
             */
            if (!submenu) {

                return;

            }


            /*
             * 找分类标题
             */
            var title =
                getFolderTitle(li);


            if (!title) {

                return;

            }


            /*
             * 已经绑定过就不重复绑定
             */
            if (
                li.dataset.protrayBound === 'true'
            ) {

                return;

            }


            li.dataset.protrayBound = 'true';


            /*
             * 添加分类 CSS
             */
            if (isTopLevel) {

                li.classList.add(
                    'protray-collapse-group'
                );

            } else {

                li.classList.add(
                    'protray-sub-collapse-group'
                );

            }


            /*
             * 标记标题
             */
            title.classList.add(
                'protray-folder-title'
            );


            /*
             * 默认折叠
             */
            li.classList.remove(
                'protray-expanded'
            );


            /*
             * =================================================
             * 点击分类标题
             * =================================================
             */

            title.addEventListener(
                'click',
                function (event) {

                    /*
                     * ★ 这里非常重要：
                     *
                     * 只有“分类标题”会进入这个事件。
                     *
                     * 普通 Markdown 文档链接完全不经过这里。
                     */


                    /*
                     * 如果标题本身是 A 标签，
                     * 而且存在真实链接，
                     * 不拦截它。
                     */

                    if (
                        title.tagName === 'A'
                        &&
                        title.getAttribute('href')
                        &&
                        title.getAttribute('href') !== '#'
                    ) {

                        return;

                    }


                    /*
                     * 分类标题只负责展开/折叠
                     */
                    event.preventDefault();

                    event.stopPropagation();


                    /*
                     * 当前是否已经展开
                     */
                    var expanded =
                        li.classList.contains(
                            'protray-expanded'
                        );


                    /*
                     * 关闭同级其他分类
                     */
                    closeSiblingGroups(li);


                    /*
                     * 切换当前分类
                     */
                    if (expanded) {

                        li.classList.remove(
                            'protray-expanded'
                        );

                    } else {

                        li.classList.add(
                            'protray-expanded'
                        );

                    }

                }
            );

        }



        /* =====================================================
           初始化侧边栏
           ===================================================== */

        function initSidebar() {

            var sidebar =
                document.querySelector(
                    '.sidebar-nav'
                );


            if (!sidebar) {

                return;

            }


            /*
             * 找到根 UL
             */
            var rootUl = null;

            for (
                var i = 0;
                i < sidebar.children.length;
                i++
            ) {

                if (
                    sidebar.children[i].tagName === 'UL'
                ) {

                    rootUl =
                        sidebar.children[i];

                    break;

                }

            }


            if (!rootUl) {

                return;

            }


            /* =================================================
               一级分类
               ================================================= */

            var topItems =
                rootUl.children;


            for (
                var i = 0;
                i < topItems.length;
                i++
            ) {

                var topItem =
                    topItems[i];


                if (
                    topItem.tagName !== 'LI'
                ) {

                    continue;

                }


                /*
                 * 只要有子菜单，
                 * 就把它当成折叠分类。
                 */
                if (
                    getDirectSubmenu(topItem)
                ) {

                    bindCollapseGroup(
                        topItem,
                        true
                    );

                }

            }


            /* =================================================
               二级 / 三级分类
               ================================================= */

            var allItems =
                sidebar.querySelectorAll('li');


            for (
                var i = 0;
                i < allItems.length;
                i++
            ) {

                var item =
                    allItems[i];


                /*
                 * 跳过一级分类
                 */
                if (
                    item.parentElement === rootUl
                ) {

                    continue;

                }


                /*
                 * 有子菜单才处理
                 */
                if (
                    getDirectSubmenu(item)
                ) {

                    bindCollapseGroup(
                        item,
                        false
                    );

                }

            }

        }



        /* =====================================================
           Docsify 加载完成以后执行
           ===================================================== */

        function startSidebar() {

            /*
             * Docsify 是异步渲染侧边栏，
             * 所以稍微等一下。
             */

            setTimeout(
                initSidebar,
                300
            );

        }



        /* =====================================================
           页面加载
           ===================================================== */

        if (
            document.readyState === 'loading'
        ) {

            document.addEventListener(
                'DOMContentLoaded',
                startSidebar
            );

        } else {

            startSidebar();

        }



        /* =====================================================
           监听 Docsify 侧边栏变化

           Docsify 是 SPA。

           点击文档后，
           页面不会整体刷新。

           所以需要监听 sidebar DOM。
           ===================================================== */

        var observerTimer =
            setInterval(
                function () {

                    var sidebar =
                        document.querySelector(
                            '.sidebar-nav'
                        );


                    if (!sidebar) {

                        return;

                    }


                    clearInterval(
                        observerTimer
                    );


                    /*
                     * 初始化
                     */
                    initSidebar();


                    /*
                     * 监听 Docsify 后续变化
                     */
                    var observer =
                        new MutationObserver(
                            function () {

                                setTimeout(
                                    initSidebar,
                                    100
                                );

                            }
                        );


                    observer.observe(
                        sidebar,
                        {
                            childList: true,
                            subtree: true
                        }
                    );

                },
                200
            );

    })();

</script>



<!-- =========================================================
     Docsify
     ========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js">
</script>



<!-- =========================================================
     Docsify 搜索
     ========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js">
</script>


</body>

</html>
