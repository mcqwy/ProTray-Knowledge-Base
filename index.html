<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ProTray 外贸知识库</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/themes/vue.css">
</head>
<body>
<div id="app"></div>
<script>
    window.$docsify = {
        name: 'ProTray 外贸知识库',
        repo: 'https://github.com/mcqwy/ProTray-Knowledge-Base',
        loadSidebar: '_sidebar.md',
        subMaxLevel: 1,           // 只在根目录加载侧边栏
        auto2top: true,
        hashbang: false,
        sidebarDisplayLevel: 1,   // 展开侧边栏到第1级，其余折叠
        topMargin: 0,            // 消除顶部边距
        search: {
            placeholder: '🔍 搜索文档...',
            noData: '😅 没有找到相关内容'
        },
        navbar: [
            { title: '🏠 首页', path: '/' },
            { title: '📖 获客指南', path: '/外贸获客全景指南' },
            { title: '📊 成交指南', path: '/外贸报价与成交指南' },
            { title: '🤖 AI 工具', path: '/7_ai工具相关/AI赋能外贸实战指南' }
        ]
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
<!-- 侧边栏折叠插件（支持记忆） -->
<script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
