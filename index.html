<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <title>ProTray 外贸知识库</title>

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >


    <!-- =====================================================
         Docsify Vue 主题
         ===================================================== -->

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/docsify/themes/vue.css"
    >


    <!-- =====================================================
         ProTray 左侧栏折叠样式
         ===================================================== -->

    <style>

        /* =====================================================
           一级分类
           ===================================================== */

        /*
         * 一级分类的子菜单默认隐藏
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group
        > ul {

            display: none;

        }


        /*
         * 一级分类展开
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group.protray-expanded
        > ul {

            display: block;

        }


        /*
         * 一级分类标题
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group
        > .protray-folder-title {

            cursor: pointer;

            user-select: none;

            font-weight: 600;

            position: relative;

        }


        /*
         * 一级分类箭头
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group
        > .protray-folder-title::before {

            content: '▶';

            display: inline-block;

            width: 18px;

            margin-right: 2px;

            font-size: 10px;

            transition:
                    transform 0.2s ease;

        }


        /*
         * 一级分类展开后的箭头
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group.protray-expanded
        > .protray-folder-title::before {

            transform: rotate(90deg);

        }


        /*
         * 一级分类鼠标悬停
         */
        .sidebar-nav
        > ul
        > li.protray-collapse-group
        > .protray-folder-title:hover {

            color: #42b983;

        }



        /* =====================================================
           二级分类
           ===================================================== */

        /*
         * 二级分类默认隐藏
         */
        .sidebar-nav
        li.protray-sub-collapse-group
        > ul {

            display: none;

        }


        /*
         * 二级分类展开
         */
        .sidebar-nav
        li.protray-sub-collapse-group.protray-expanded
        > ul {

            display: block;

        }


        /*
         * 二级分类标题
         */
        .sidebar-nav
        li.protray-sub-collapse-group
        > .protray-folder-title {

            cursor: pointer;

            user-select: none;

            position: relative;

        }


        /*
         * 二级分类箭头
         */
        .sidebar-nav
        li.protray-sub-collapse-group
        > .protray-folder-title::before {

            content: '▶';

            display: inline-block;

            width: 16px;

            margin-right: 2px;

            font-size: 9px;

            transition:
                    transform 0.2s ease;

        }


        /*
         * 二级分类展开后的箭头
         */
        .sidebar-nav
        li.protray-sub-collapse-group.protray-expanded
        > .protray-folder-title::before {

            transform: rotate(90deg);

        }


        /*
         * 二级分类鼠标悬停
         */
        .sidebar-nav
        li.protray-sub-collapse-group
        > .protray-folder-title:hover {

            color: #42b983;

        }



        /* =====================================================
           普通文档链接

           不修改 Docsify 原本的点击行为
           ===================================================== */

        .sidebar-nav a {

            cursor: pointer;

        }

    </style>

</head>


<body>

<div id="app"></div>


<script>

    /* =========================================================
       Docsify 配置
       ========================================================= */

    window.$docsify = {

        /*
         * 网站名称
         */
        name: 'ProTray 外贸知识库',


        /*
         * GitHub 仓库
         */
        repo:
            'https://github.com/mcqwy/ProTray-Knowledge-Base',


        /*
         * 使用根目录 _sidebar.md
         */
        loadSidebar: '_sidebar.md',


        /*
         * =====================================================
         * 解决子目录 _sidebar.md 404
         * =====================================================
         *
         * 无论当前页面在哪个目录，
         * 都使用网站根目录的 _sidebar.md
         *
         * 例如：
         *
         * /1_市场调研/调研指南.md
         *
         * 不再请求：
         *
         * /1_市场调研/_sidebar.md
         *
         * 而是始终使用：
         *
         * /_sidebar.md
         */

        alias: {

            '/.*/_sidebar.md':
                '/_sidebar.md'

        },


        /*
         * 侧边栏层级
         */
        subMaxLevel: 1,


        /*
         * 页面切换自动回到顶部
         */
        auto2top: true,


        /*
         * 不使用 #!
         */
        hashbang: false,


        /*
         * =====================================================
         * 搜索
         * =====================================================
         */

        search: {

            placeholder:
                '🔍 搜索文档...',

            noData:
                '😅 没有找到相关内容',

            depth: 6,

            hideOtherSidebarContent: false

        },


        /*
         * =====================================================
         * 顶部导航
         * =====================================================
         */

        navbar: [

            {
                title: '🏠 首页',

                path: '/'
            },

            {
                title: '📖 获客指南',

                path:
                    '/外贸获客全景指南'
            },

            {
                title: '📊 成交指南',

                path:
                    '/外贸报价与成交指南'
            },

            {
                title: '🤖 AI 工具',

                path:
                    '/7_ai工具相关/AI赋能外贸实战指南'
            }

        ]

    };



    /* =========================================================
       ProTray 左侧栏折叠系统
       ========================================================= */

    (function () {

        'use strict';


        /*
         * =====================================================
         * localStorage 保存名称
         * =====================================================
         */

        var STORAGE_KEY =
            'protray-sidebar-collapse-state-v1';



        /* =====================================================
           读取保存的折叠状态
           ===================================================== */

        function loadState() {

            try {

                var saved =
                    localStorage.getItem(
                        STORAGE_KEY
                    );


                if (!saved) {

                    return {};

                }


                var state =
                    JSON.parse(saved);


                if (
                    typeof state !== 'object'
                    ||
                    state === null
                ) {

                    return {};

                }


                return state;

            }
            catch (error) {

                console.warn(
                    'ProTray：读取侧边栏状态失败',
                    error
                );

                return {};

            }

        }



        /* =====================================================
           保存折叠状态
           ===================================================== */

        function saveState() {

            try {

                var state = {};


                /*
                 * 找到所有已经绑定的折叠分类
                 */
                var groups =
                    document.querySelectorAll(
                        '.sidebar-nav .protray-collapse-group, ' +
                        '.sidebar-nav .protray-sub-collapse-group'
                    );


                for (
                    var i = 0;
                    i < groups.length;
                    i++
                ) {

                    var group =
                        groups[i];


                    var key =
                        group.dataset.protrayKey;


                    if (!key) {

                        continue;

                    }


                    state[key] =
                        group.classList.contains(
                            'protray-expanded'
                        );

                }


                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(state)
                );

            }
            catch (error) {

                console.warn(
                    'ProTray：保存侧边栏状态失败',
                    error
                );

            }

        }



        /* =====================================================
           获取直属 UL
           ===================================================== */

        function getDirectSubmenu(li) {

            var children =
                li.children;


            for (
                var i = 0;
                i < children.length;
                i++
            ) {

                if (
                    children[i].tagName === 'UL'
                ) {

                    return children[i];

                }

            }


            return null;

        }



        /* =====================================================
           获取分类标题

           兼容：

           <strong>
           <p>
           <div>
           <a>

           不假定 _sidebar.md 的 HTML 结构。
           ===================================================== */

        function getFolderTitle(li) {

            var children =
                li.children;


            for (
                var i = 0;
                i < children.length;
                i++
            ) {

                var child =
                    children[i];


                /*
                 * UL 是子菜单，不是标题
                 */
                if (
                    child.tagName === 'UL'
                ) {

                    continue;

                }


                /*
                 * P
                 */
                if (
                    child.tagName === 'P'
                ) {

                    return child;

                }


                /*
                 * STRONG
                 */
                if (
                    child.tagName === 'STRONG'
                ) {

                    return child;

                }


                /*
                 * DIV
                 */
                if (
                    child.tagName === 'DIV'
                ) {

                    return child;

                }


                /*
                 * A 作为最后兼容方案
                 */
                if (
                    child.tagName === 'A'
                ) {

                    return child;

                }

            }


            return null;

        }



        /* =====================================================
           获取标题文字
           ===================================================== */

        function getTitleText(title) {

            if (!title) {

                return '';

            }


            return (
                title.textContent
                ||
                ''
            )
                .replace(
                    /\s+/g,
                    ' '
                )
                .trim();

        }



        /* =====================================================
           生成分类唯一 Key

           使用：

           一级分类：
           top:战略决策

           二级分类：
           sub:业务资料库/工厂档案

           这样即使名称相同也尽量避免冲突。
           ===================================================== */

        function getGroupKey(
            li,
            isTopLevel
        ) {

            var title =
                getFolderTitle(li);


            var text =
                getTitleText(title);


            if (isTopLevel) {

                return (
                    'top:' +
                    text
                );

            }


            /*
             * 获取上级分类标题
             */
            var parentLi =
                li.parentElement
                    ? li.parentElement.parentElement
                    : null;


            var parentTitle =
                parentLi
                    ? getFolderTitle(parentLi)
                    : null;


            var parentText =
                getTitleText(parentTitle);


            return (
                'sub:' +
                parentText +
                '/' +
                text
            );

        }



        /* =====================================================
           关闭同级分类

           注意：
           这里只改变当前层级。

           不会删除 localStorage。
           ===================================================== */

        function closeSiblingGroups(
            currentLi
        ) {

            var parent =
                currentLi.parentElement;


            if (!parent) {

                return;

            }


            var siblings =
                parent.children;


            for (
                var i = 0;
                i < siblings.length;
                i++
            ) {

                var sibling =
                    siblings[i];


                if (
                    sibling === currentLi
                ) {

                    continue;

                }


                if (
                    sibling.classList.contains(
                        'protray-collapse-group'
                    )
                    ||
                    sibling.classList.contains(
                        'protray-sub-collapse-group'
                    )
                ) {

                    sibling.classList.remove(
                        'protray-expanded'
                    );


                    /*
                     * 如果关闭一级分类，
                     * 顺便关闭里面的二级分类。
                     */
                    var innerGroups =
                        sibling.querySelectorAll(
                            '.protray-expanded'
                        );


                    for (
                        var j = 0;
                        j < innerGroups.length;
                        j++
                    ) {

                        innerGroups[j]
                            .classList
                            .remove(
                                'protray-expanded'
                            );

                    }

                }

            }

        }



        /* =====================================================
           恢复当前分类状态
           ===================================================== */

        function restoreGroupState(
            li,
            key,
            savedState
        ) {

            /*
             * 有保存记录：
             *
             * true  = 展开
             * false = 折叠
             */
            if (
                Object.prototype.hasOwnProperty.call(
                    savedState,
                    key
                )
            ) {

                if (
                    savedState[key] === true
                ) {

                    li.classList.add(
                        'protray-expanded'
                    );

                } else {

                    li.classList.remove(
                        'protray-expanded'
                    );

                }


                return;

            }


            /*
             * 没有保存记录：
             *
             * ★ 默认折叠
             */
            li.classList.remove(
                'protray-expanded'
            );

        }



        /* =====================================================
           绑定一个折叠分类
           ===================================================== */

        function bindCollapseGroup(
            li,
            isTopLevel,
            savedState
        ) {

            /*
             * 找直属子菜单
             */
            var submenu =
                getDirectSubmenu(li);


            /*
             * 没有子菜单：
             *
             * 这是普通文档链接。
             *
             * ★ 不处理。
             */
            if (!submenu) {

                return;

            }


            /*
             * 找标题
             */
            var title =
                getFolderTitle(li);


            if (!title) {

                return;

            }


            /*
             * 已经绑定过
             */
            if (
                li.dataset.protrayBound === 'true'
            ) {

                return;

            }


            /*
             * 获取唯一 Key
             */
            var key =
                getGroupKey(
                    li,
                    isTopLevel
                );


            li.dataset.protrayKey =
                key;


            /*
             * 标记已经绑定
             */
            li.dataset.protrayBound =
                'true';


            /*
             * 添加对应 CSS class
             */
            if (isTopLevel) {

                li.classList.add(
                    'protray-collapse-group'
                );

            } else {

                li.classList.add(
                    'protray-sub-collapse-group'
                );

            }


            /*
             * 给标题添加 CSS class
             */
            title.classList.add(
                'protray-folder-title'
            );


            /*
             * ★ 恢复之前保存的状态
             */
            restoreGroupState(
                li,
                key,
                savedState
            );


            /* =================================================
               点击分类标题
               ================================================= */

            title.addEventListener(
                'click',
                function (event) {

                    /*
                     * 如果这个标题本身就是一个真正的链接，
                     * 那么不要拦截。
                     */
                    if (
                        title.tagName === 'A'
                        &&
                        title.getAttribute('href')
                        &&
                        title.getAttribute('href') !== '#'
                    ) {

                        return;

                    }


                    /*
                     * 分类标题不是文档链接，
                     * 所以这里阻止默认行为。
                     */
                    event.preventDefault();

                    event.stopPropagation();


                    /*
                     * 当前是否已经展开
                     */
                    var expanded =
                        li.classList.contains(
                            'protray-expanded'
                        );


                    /*
                     * 关闭同级其他分类
                     */
                    closeSiblingGroups(
                        li
                    );


                    /*
                     * 当前分类切换
                     */
                    if (expanded) {

                        li.classList.remove(
                            'protray-expanded'
                        );

                    } else {

                        li.classList.add(
                            'protray-expanded'
                        );

                    }


                    /*
                     * ★★★ 最重要 ★★★
                     *
                     * 每次点击以后立即保存。
                     */
                    saveState();

                }
            );

        }



        /* =====================================================
           初始化整个侧边栏
           ===================================================== */

        function initSidebar() {

            var sidebar =
                document.querySelector(
                    '.sidebar-nav'
                );


            if (!sidebar) {

                return;

            }


            /*
             * 读取 localStorage
             */
            var savedState =
                loadState();


            /*
             * 找根 UL
             */
            var rootUl = null;


            for (
                var i = 0;
                i < sidebar.children.length;
                i++
            ) {

                if (
                    sidebar.children[i].tagName === 'UL'
                ) {

                    rootUl =
                        sidebar.children[i];

                    break;

                }

            }


            if (!rootUl) {

                return;

            }



            /* =================================================
               一级分类
               ================================================= */

            var topItems =
                rootUl.children;


            for (
                var i = 0;
                i < topItems.length;
                i++
            ) {

                var topItem =
                    topItems[i];


                if (
                    topItem.tagName !== 'LI'
                ) {

                    continue;

                }


                /*
                 * 只有拥有子菜单的 LI
                 * 才是分类。
                 */
                if (
                    getDirectSubmenu(topItem)
                ) {

                    bindCollapseGroup(
                        topItem,
                        true,
                        savedState
                    );

                }

            }



            /* =================================================
               二级 / 三级分类
               ================================================= */

            var allItems =
                sidebar.querySelectorAll(
                    'li'
                );


            for (
                var i = 0;
                i < allItems.length;
                i++
            ) {

                var item =
                    allItems[i];


                /*
                 * 跳过一级分类
                 */
                if (
                    item.parentElement === rootUl
                ) {

                    continue;

                }


                /*
                 * 有直属子菜单才处理
                 */
                if (
                    getDirectSubmenu(item)
                ) {

                    bindCollapseGroup(
                        item,
                        false,
                        savedState
                    );

                }

            }

        }



        /* =====================================================
           启动
           ===================================================== */

        function startSidebar() {

            setTimeout(
                initSidebar,
                300
            );

        }



        /* =====================================================
           DOM 加载
           ===================================================== */

        if (
            document.readyState === 'loading'
        ) {

            document.addEventListener(
                'DOMContentLoaded',
                startSidebar
            );

        } else {

            startSidebar();

        }



        /* =====================================================
           监听 Docsify 动态 Sidebar

           Docsify 是 SPA：

           点击文档
           ↓
           页面内容改变
           ↓
           Sidebar 可能重新渲染

           所以这里重新检查。

           ★ 但不会重新设置折叠状态。
           ===================================================== */

        var observerTimer =
            setInterval(
                function () {

                    var sidebar =
                        document.querySelector(
                            '.sidebar-nav'
                        );


                    if (!sidebar) {

                        return;

                    }


                    clearInterval(
                        observerTimer
                    );


                    /*
                     * 第一次初始化
                     */
                    initSidebar();


                    /*
                     * 监听 Sidebar DOM
                     */
                    var observer =
                        new MutationObserver(
                            function () {

                                setTimeout(
                                    initSidebar,
                                    100
                                );

                            }
                        );


                    observer.observe(
                        sidebar,
                        {

                            childList: true,

                            subtree: true

                        }
                    );

                },
                200
            );

    })();

</script>



<!-- =========================================================
     Docsify 核心
     ========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js">
</script>



<!-- =========================================================
     Docsify 搜索插件
     ========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js">
</script>


</body>

</html>
