<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>ProTray 外贸知识库</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/docsify/themes/vue.css"
    >

    <style>
        /* =========================================================
           ProTray 侧边栏折叠样式
           ========================================================= */

        /* 一级分类默认隐藏子菜单 */
        .protray-collapse-group > ul {
            display: none;
        }

        /* 一级分类展开 */
        .protray-collapse-group.protray-expanded > ul {
            display: block;
        }

        /* 二级分类默认隐藏 */
        .protray-sub-collapse-group > ul {
            display: none;
        }

        /* 二级分类展开 */
        .protray-sub-collapse-group.protray-expanded > ul {
            display: block;
        }

        /* 分类标题 */
        .protray-collapse-title,
        .protray-sub-collapse-title {
            cursor: pointer;
            user-select: none;
        }

        /* 箭头 */
        .protray-collapse-arrow {
            display: inline-block;
            width: 18px;
            transition: transform 0.2s ease;
        }

        /* 展开时箭头旋转 */
        .protray-collapse-group.protray-expanded
        > .protray-collapse-title
        .protray-collapse-arrow,

        .protray-sub-collapse-group.protray-expanded
        > .protray-sub-collapse-title
        .protray-collapse-arrow {
            transform: rotate(90deg);
        }

        /* 防止折叠标题出现奇怪的链接下划线 */
        .protray-collapse-title:hover,
        .protray-sub-collapse-title:hover {
            text-decoration: none;
        }

        /* =========================================================
           页面内锚点滚动优化
           ========================================================= */

        html {
            scroll-behavior: smooth;
        }

        /* 给标题预留顶部空间，避免被顶部导航遮挡 */
        .markdown-section h1,
        .markdown-section h2,
        .markdown-section h3,
        .markdown-section h4,
        .markdown-section h5,
        .markdown-section h6 {
            scroll-margin-top: 20px;
        }
    </style>
</head>

<body>

<div id="app"></div>


<!-- =========================================================
     Docsify 配置
     ========================================================= -->

<script>

    window.$docsify = {

        /* 网站名称 */
        name: 'ProTray 外贸知识库',

        /* GitHub 仓库 */
        repo: 'https://github.com/mcqwy/ProTray-Knowledge-Base',

        /* =====================================================
           Sidebar
           ===================================================== */

        loadSidebar: '_sidebar.md',

        /*
         * 非常重要：
         *
         * Docsify 在进入子路径时可能寻找：
         *
         * /1_市场调研/_sidebar.md
         *
         * 导致 404。
         *
         * 统一指向根目录 _sidebar.md。
         */
        alias: {
            '/.*/_sidebar.md': '/_sidebar.md'
        },

        /* 文档标题目录深度 */
        subMaxLevel: 1,

        /* 打开新文档时自动回顶部 */
        auto2top: true,

        /* 不使用 hashbang */
        hashbang: false,

        /* =====================================================
           搜索
           ===================================================== */

        search: {
            placeholder: '🔍 搜索文档...',
            noData: '😅 没有找到相关内容'
        },

        /* =====================================================
           顶部导航
           ===================================================== */

        navbar: [

            {
                title: '🏠 首页',
                path: '/'
            },

            {
                title: '📖 获客指南',
                path: '/外贸获客全景指南'
            },

            {
                title: '📊 成交指南',
                path: '/外贸报价与成交指南'
            },

            {
                title: '🤖 AI 工具',
                path: '/7_ai工具相关/AI赋能外贸实战指南'
            }

        ]

        /*
         * 注意：
         *
         * 这里故意没有 slugify。
         *
         * 不修改 Docsify 原本的标题 ID。
         *
         * 因此：
         *
         * #1-报价篇
         * #11-报价单模板
         * #6-售后与复购篇
         *
         * 都保持原来的 Markdown / Docsify 锚点体系。
         */
    };

</script>


<!-- =========================================================
     页面内锚点修复器

     必须放在 Docsify 之前注册。

     目的：
     解决：

     document.querySelector('#6-售后与复购篇')

     这种非法 CSS Selector。

     改成：

     document.getElementById('6-售后与复购篇')

     ========================================================= -->

<script>

    (function () {

        /*
         * 判断一个链接是不是“当前页面内部锚点”
         *
         * 例如：
         *
         * #1-报价篇
         * #11-报价单模板
         * #6-售后与复购篇
         *
         * 都属于页面内部锚点。
         *
         * 而：
         *
         * #/外贸报价与成交指南
         *
         * 属于 Docsify 路由，不能拦截。
         */
        function isInternalAnchor(href) {

            if (!href) {
                return false;
            }

            if (href.charAt(0) !== '#') {
                return false;
            }

            /*
             * Docsify Hash Router：
             *
             * #/xxx
             *
             * 不能当普通页面锚点处理。
             */
            if (href.indexOf('#/') === 0) {
                return false;
            }

            return href.length > 1;
        }


        /*
         * 获取锚点 ID
         *
         * href：
         *
         * #6-售后与复购篇
         *
         * 得到：
         *
         * 6-售后与复购篇
         */
        function getAnchorId(href) {

            var id = href.substring(1);

            /*
             * URL hash 可能经过编码。
             *
             * 例如：
             *
             * #6-%E5%94%AE%E5%90%8E...
             */
            try {
                return decodeURIComponent(id);
            } catch (error) {
                return id;
            }
        }


        /*
         * 找目标元素
         *
         * 绝对不要：
         *
         * document.querySelector('#' + id)
         *
         * 因为：
         *
         * #6-xxx
         *
         * 不是合法 CSS selector。
         *
         * getElementById 对 HTML ID 没有这个限制。
         */
        function findTarget(id) {

            if (!id) {
                return null;
            }

            return document.getElementById(id);
        }


        /*
         * 执行滚动
         */
        function scrollToAnchor(id) {

            var target = findTarget(id);

            if (!target) {
                return false;
            }

            /*
             * 使用 scrollIntoView。
             *
             * Docsify 页面已经渲染完成后，
             * 直接滚动到对应标题。
             */
            try {

                target.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });

            } catch (error) {

                /*
                 * 兼容旧浏览器
                 */
                target.scrollIntoView();

            }

            return true;
        }


        /*
         * =========================================================
         * 拦截页面内部锚点点击
         * =========================================================
         *
         * 使用 capture = true。
         *
         * 这样我们的处理发生在 Docsify 普通 click
         * 处理之前。
         */
        document.addEventListener(
            'click',
            function (event) {

                /*
                 * 找到实际被点击的 <a>
                 */
                var link = event.target.closest
                    ? event.target.closest('a')
                    : null;

                if (!link) {
                    return;
                }

                var href = link.getAttribute('href');

                /*
                 * 不是页面内部锚点：
                 * 交给 Docsify 正常处理。
                 */
                if (!isInternalAnchor(href)) {
                    return;
                }

                var id = getAnchorId(href);

                /*
                 * 当前页面找不到目标：
                 * 不拦截，让 Docsify 正常处理。
                 */
                var target = findTarget(id);

                if (!target) {
                    return;
                }

                /*
                 * 阻止浏览器默认 hash 行为
                 */
                event.preventDefault();

                /*
                 * 阻止 Docsify 后续 click 处理
                 */
                event.stopPropagation();

                /*
                 * 某些浏览器支持 stopImmediatePropagation。
                 */
                if (event.stopImmediatePropagation) {
                    event.stopImmediatePropagation();
                }

                /*
                 * 滚动到目标位置
                 */
                scrollToAnchor(id);

                /*
                 * 更新地址栏 hash。
                 *
                 * 使用 replaceState 而不是 location.hash：
                 *
                 * location.hash = ...
                 *
                 * 可能触发 Docsify 路由重新渲染。
                 *
                 * replaceState 不触发 hashchange，
                 * 因此不会导致页面重新加载/回顶部。
                 */
                try {

                    var newUrl =
                        window.location.pathname +
                        window.location.search +
                        '#' +
                        encodeURIComponent(id)
                            .replace(/%2D/gi, '-')
                            .replace(/%2F/gi, '/');

                    window.history.replaceState(
                        null,
                        '',
                        newUrl
                    );

                } catch (error) {

                    /*
                     * 极端情况下忽略地址栏更新，
                     * 不影响页面滚动。
                     */

                }

            },
            true
        );


        /*
         * =========================================================
         * 页面加载 / Docsify 渲染完成后处理已有 hash
         * =========================================================
         *
         * 例如用户直接打开：
         *
         * .../外贸报价与成交指南#6-售后与复购篇
         *
         * Docsify 渲染完成后，我们再寻找对应标题。
         */
        function tryInitialAnchor() {

            var hash = window.location.hash;

            if (!hash) {
                return;
            }

            /*
             * Docsify 路由不要处理
             */
            if (hash.indexOf('#/') === 0) {
                return;
            }

            var id = getAnchorId(hash);

            if (!id) {
                return;
            }

            var target = findTarget(id);

            if (!target) {
                return;
            }

            /*
             * 延迟一点执行，确保 Markdown 已经完成渲染。
             */
            setTimeout(function () {

                scrollToAnchor(id);

            }, 100);

        }


        /*
         * DOM 初次加载
         */
        window.addEventListener(
            'load',
            function () {

                setTimeout(
                    tryInitialAnchor,
                    300
                );

            }
        );


        /*
         * Docsify 动态渲染内容。
         *
         * MutationObserver 负责监听 #app，
         * 一旦 Markdown 渲染完成，就再次尝试锚点。
         */
        var observer = new MutationObserver(
            function () {

                if (window.location.hash) {

                    setTimeout(
                        tryInitialAnchor,
                        50
                    );

                }

            }
        );


        /*
         * 等待 #app 出现
         */
        function startObserver() {

            var app = document.getElementById('app');

            if (!app) {

                setTimeout(
                    startObserver,
                    50
                );

                return;
            }

            observer.observe(
                app,
                {
                    childList: true,
                    subtree: true
                }
            );

        }

        startObserver();

    })();

</script>


<!-- =========================================================
     Docsify
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>


<!-- =========================================================
     ProTray 侧边栏折叠 + 状态记忆
     ========================================================= -->

<script>

    (function () {

        /*
         * 保存侧边栏展开状态的 localStorage key
         */
        var STORAGE_KEY =
            'protray-sidebar-collapse-state-v2';


        /*
         * 读取状态
         */
        function loadState() {

            try {

                var raw =
                    localStorage.getItem(STORAGE_KEY);

                if (!raw) {
                    return {};
                }

                return JSON.parse(raw);

            } catch (error) {

                return {};

            }

        }


        /*
         * 保存状态
         */
        function saveState(state) {

            try {

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(state)
                );

            } catch (error) {

                /*
                 * localStorage 不可用时不影响侧边栏。
                 */

            }

        }


        /*
         * 获取当前状态
         */
        var state = loadState();


        /*
         * 找一个 li 的直接子菜单
         */
        function getDirectSubmenu(li) {

            if (!li) {
                return null;
            }

            var children = li.children;

            for (var i = 0; i < children.length; i++) {

                if (
                    children[i].tagName &&
                    children[i].tagName.toLowerCase() === 'ul'
                ) {
                    return children[i];
                }

            }

            return null;

        }


        /*
         * 获取分类标题
         */
        function getTitleElement(li) {

            var children = li.children;

            for (var i = 0; i < children.length; i++) {

                var child = children[i];

                if (
                    child.tagName &&
                    child.tagName.toLowerCase() === 'a'
                ) {

                    return child;

                }

            }

            return null;

        }


        /*
         * 根据标题生成稳定 key
         */
        function getGroupKey(title) {

            if (!title) {
                return '';
            }

            var text =
                title.textContent
                    .replace(/\s+/g, ' ')
                    .trim();

            return text;

        }


        /*
         * 给分类标题增加箭头
         */
        function prepareTitle(title) {

            if (!title) {
                return;
            }

            if (
                title.querySelector(
                    '.protray-collapse-arrow'
                )
            ) {
                return;
            }

            var arrow =
                document.createElement('span');

            arrow.className =
                'protray-collapse-arrow';

            arrow.textContent = '▶';

            title.insertBefore(
                arrow,
                title.firstChild
            );

        }


        /*
         * 收起同级其它分类
         */
        function closeSiblings(li) {

            var parent = li.parentElement;

            if (!parent) {
                return;
            }

            var siblings = parent.children;

            for (var i = 0; i < siblings.length; i++) {

                var sibling = siblings[i];

                if (
                    sibling === li ||
                    !sibling.classList
                ) {
                    continue;
                }

                if (
                    sibling.classList.contains(
                        'protray-collapse-group'
                    )
                ) {

                    sibling.classList.remove(
                        'protray-expanded'
                    );

                }

                if (
                    sibling.classList.contains(
                        'protray-sub-collapse-group'
                    )
                ) {

                    sibling.classList.remove(
                        'protray-expanded'
                    );

                }

            }

        }


        /*
         * 切换分类
         */
        function toggleGroup(li, title) {

            var expanded =
                li.classList.toggle(
                    'protray-expanded'
                );

            var key =
                getGroupKey(title);

            if (key) {

                state[key] = expanded;

                saveState(state);

            }

            /*
             * 同级分类只保留一个展开。
             */
            if (expanded) {

                closeSiblings(li);

            }

        }


        /*
         * 初始化一级/二级分类
         */
        function bindGroups() {

            var sidebar =
                document.querySelector(
                    '.sidebar-nav'
                );

            if (!sidebar) {
                return;
            }


            var items =
                sidebar.querySelectorAll('li');


            for (var i = 0; i < items.length; i++) {

                var li = items[i];

                var submenu =
                    getDirectSubmenu(li);

                if (!submenu) {
                    continue;
                }


                var title =
                    getTitleElement(li);

                if (!title) {
                    continue;
                }


                /*
                 * 判断是不是一级分类
                 */
                var parentLi =
                    li.parentElement
                        ? li.parentElement.closest('li')
                        : null;


                var isSubGroup =
                    !!parentLi;


                if (isSubGroup) {

                    li.classList.add(
                        'protray-sub-collapse-group'
                    );

                    li.classList.remove(
                        'protray-collapse-group'
                    );

                } else {

                    li.classList.add(
                        'protray-collapse-group'
                    );

                    li.classList.remove(
                        'protray-sub-collapse-group'
                    );

                }


                if (!title.classList.contains(
                    'protray-collapse-title'
                )) {

                    if (isSubGroup) {

                        title.classList.add(
                            'protray-sub-collapse-title'
                        );

                    } else {

                        title.classList.add(
                            'protray-collapse-title'
                        );

                    }

                }


                prepareTitle(title);


                /*
                 * 恢复上次状态
                 */
                var key =
                    getGroupKey(title);


                if (
                    key &&
                    state.hasOwnProperty(key)
                ) {

                    if (state[key]) {

                        li.classList.add(
                            'protray-expanded'
                        );

                    } else {

                        li.classList.remove(
                            'protray-expanded'
                        );

                    }

                }


                /*
                 * 防止重复绑定
                 */
                if (
                    title.dataset.protrayBound === '1'
                ) {
                    continue;
                }


                title.dataset.protrayBound = '1';


                /*
                 * 分类标题点击：
                 *
                 * 只在标题本身是分类时拦截。
                 *
                 * 普通文档链接完全不处理。
                 */
                title.addEventListener(
                    'click',
                    function (event) {

                        var currentTitle =
                            event.currentTarget;

                        var currentLi =
                            currentTitle.parentElement;

                        /*
                         * 如果标题有真实文档地址，
                         * 仍然允许普通导航。
                         *
                         * 这里只处理“有子菜单”的分类。
                         */
                        var currentSubmenu =
                            getDirectSubmenu(
                                currentLi
                            );

                        if (!currentSubmenu) {
                            return;
                        }

                        event.preventDefault();
                        event.stopPropagation();

                        toggleGroup(
                            currentLi,
                            currentTitle
                        );

                    }
                );

            }

        }


        /*
         * Docsify 会动态重绘 sidebar。
         *
         * MutationObserver 负责每次重新绑定。
         */
        var sidebarObserver =
            new MutationObserver(
                function () {

                    bindGroups();

                }
            );


        /*
         * 启动
         */
        function startSidebarObserver() {

            var sidebar =
                document.querySelector(
                    '.sidebar'
                );

            if (!sidebar) {

                setTimeout(
                    startSidebarObserver,
                    100
                );

                return;

            }


            bindGroups();


            sidebarObserver.observe(
                sidebar,
                {
                    childList: true,
                    subtree: true
                }
            );

        }


        startSidebarObserver();

    })();

</script>

</body>
</html>
